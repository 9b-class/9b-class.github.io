        <script>
            const Akim = document.createElement('div');
            Akim.className = "turkistan";
            Akim.innerHTML = `
                
                <h3>Әзімбек Пазылбекұлы – Түркістан қаласының әкімі</h3>
                <img src="https://www.gov.kz/uploads/2024/10/15/947598a5824d62136921cfee8927b9c0_1280x720.jpg" alt="Әзімбек Пазылбекұлы" width="200px">
<p>Әзімбек Пазылбекұлы 2024 жылдың 1 қазанында Түркістан қаласының әкімі болып тағайындалды. Бұл шешім Түркістан облысының әкімі Дархан Сатыбалдының бұйрығымен қабылданды.</p>

<h3>Білімі мен еңбек жолы</h3>
<p>Әзімбек Пазылбекұлы 1991 жылы Қызылорда облысы, Жаңақорған ауданында дүниеге келген. Ол әл-Фараби атындағы Қазақ ұлттық университеті, Қорқыт Ата атындағы Қызылорда университеті, М. Нарикбаев атындағы KAZGUU университеті және «Болашақ» университеттерінде білім алған. Мамандықтары: мемлекеттік және жергілікті басқару, экономика, құрылыс және құқық.</p>

<p>Еңбек жолын 2013 жылы Қызылорда облысының ішкі саясат басқармасында бастаған. Кейін түрлі мемлекеттік мекемелерде сарапшы, бөлім басшысы, комитет төрағасының орынбасары қызметтерін атқарды. Атап айтқанда, ҚР Инвестициялар және даму министрлігі мен ҚР Индустрия және инфрақұрылымдық даму министрлігінде жұмыс істеген.</p>

<h3>Түркістан қаласының әкімі ретіндегі міндеттері</h3>
<p>Әкім ретінде оның негізгі мақсаты – Түркістан қаласының экономикалық және туристік әлеуетін арттыру, заманауи инфрақұрылымды дамыту және қаланы түркі әлемінің рухани орталығына айналдыру.</p>
`
            document.body.appendChild(Akim);

            const CopyRight = document.createElement("h3");
            CopyRight.className = "turkistan";
            CopyRight.innerHTML = "<p>© 2025 Түркістан қаласы</p>"
            document.body.appendChild(CopyRight);
