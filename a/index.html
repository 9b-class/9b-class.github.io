<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing</title>
    <style>
        body {
            display: flex;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .open {
            width: 25px;
            height: 25px;
        }

        .continer {

            display: none;
            position: fixed;
            align-self: center;
            align-items: center;
            justify-content: center;
            margin-left: 20%;
            border-radius: 10px;
            color: #fff;
            background-color: #afafaf;
            width: 60vw;
            height: 30vh;
        }

        .exit {
            display: flex;
            align-self: center;
            justify-content: center;
            width: 25px;
            height: 25px;
            margin-bottom: 26vh;
            margin-left: 55vw;
        }

        .text {
            display:flex;
            position: fixed;
        }
    </style>
</head>
<body>
    <button class="open" id="open" onclick="Open()">:)</button>
    <div class="continer" id="continer">
        <button class="exit" id="exit" onclick="Exit()">:(</button>
        <p  class="text">salem menin esimim Ramazan</p>
    </div>
    <script>
        const continer = document.getElementById("continer");
        function Open() { continer.style.display = "flex"; }
        function Exit() { continer.style.display = "none" }

    </script>
</body>
</html>
