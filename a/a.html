<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini iPhone UI</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .iphone {
      width: 90vw;
      max-width: 300px;
      aspect-ratio: 430 / 932;
      background: #000;
      border: 10px solid #222;
      border-radius: 40px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }

    .notch {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 22px;
      background: #000;
      border-radius: 12px;
      z-index: 10;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom right, #1e1e1e, #2b2b2b);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 40px;
      box-sizing: border-box;
    }

    .screen h1 {
      font-size: 20px;
      margin: 0;
    }

    .screen p {
      color: #aaa;
      font-size: 14px;
      text-align: center;
      padding: 0 10px;
    }
  </style>
</head>
<body>

<div class="iphone">
  <div class="notch"></div>
  <div class="screen">
    <h1>iOS UI</h1>
    <p>Бұл макет барлық экранға сиятындай кішірейтілген.</p>
  </div>
</div>

</body>
</html>
