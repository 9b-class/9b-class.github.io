<body>
  <p>Hello there!</p>

  <button onclick="TestInput()">submit</button> <br><br>
  <p id="text"></p>


  <script>
    function TestInput() {
      let name = document.getElementById('nameInput').value;
      let password = document.getElementById('passInput').value;
      let text = document.getElementById('text');
      if (name == "Ramazan") {
        if (password == "1234") {
          text.innerHTML = '<a href="c.html">Welcome Mr</a>';
        } else {
          text.innerHTML = 'error password';
        }
      } else {
        text.innerHTML = 'not found a name';
      }
    }
  </script>
