            history.innerHTML = `
  <h3>Түркістан қаласының тарихы</h3>
  <p>Түркістан – Қазақстанның оңтүстігіндегі ежелгі әрі қасиетті қала, тарихи шежіресі мың жылдан аса уақытқа созылады. Ол көне Ясы қаласының орнына салынған және түркі халықтарының мәдени, рухани және саяси орталығы ретінде белгілі. Қала Ұлы Жібек жолының бойында орналасып, сауда мен өркениеттің дамуына үлкен үлес қосты.</p>
  <p>XI ғасырда бұл қалада сопылық поэзияның және рухани ілімнің негізін қалаған Қожа Ахмет Ясауи өмір сүріп, ұстаздық етті. Оның ілімі Орталық Азияда кең таралып, көптеген шәкірттерге ықпал етті. XIV ғасырдың соңында Әмір Темірдің бұйрығымен Қожа Ахмет Ясауиге арнап үлкен кесене салынды. Бұл архитектуралық ескерткіш бүгінгі күнге дейін сақталып, ЮНЕСКО-ның Бүкіләлемдік мұралар тізіміне енген.</p>
  <p>XVI-XVIII ғасырлар аралығында Түркістан Қазақ хандығының астанасы болды. Бұл кезеңде қала тек діни ғана емес, сонымен қатар саяси шешімдер қабылданатын орталыққа айналды. Түркістанда қазақ хандарының таққа отыру рәсімдері өтті және көптеген хандар осында жерленген. Бұл оның тарихи және ұлттық маңызын арттыра түсті.</p>
  <p>Ресей империясының отарлау кезеңінде Түркістан өзінің мәртебесінен айырылды, бірақ рухани маңызы жоғалған жоқ. Кеңес дәуірінде қала екінші планға ығыстырылды, дегенмен Қожа Ахмет Ясауи кесенесі тарихи мұра ретінде сақталды.</p>
  <p>Тәуелсіздік алғаннан кейін, Қазақстан Түркістанның рухани орнын қайта жаңғыртуға ерекше көңіл бөлді. 2018 жылы Түркістан облысының орталығы ретінде бекітілгеннен кейін, қалада ауқымды құрылыс пен тарихи жаңғырту жұмыстары басталды. Қазіргі таңда Түркістан – тек Қазақстанның ғана емес, бүкіл түркі дүниесінің мәдени және рухани астанасына айналуда.</p>
  <p>Қалада жаңа әуежай, туристік кешендер, қонақ үйлер мен көрме залдары салынды. Сонымен қатар, Түркістанда түркі халықтарының ортақ тарихи мұрасына арналған іс-шаралар жиі ұйымдастырылады. Қалада өткен мен бүгін үндестік таба отырып, болашаққа батыл қадам жасауда.</p>
`;
            document.body.appendChild(history);
