<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #1A1A2E;
            color: #FFFFFF;
            font-family: Noto Sans, sans-serif;
            margin: 0;
        }

        .header{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #16213E;
        }

        .header ul{
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .header ul li{
            cursor: pointer;
            font-weight: bold;
        }

        .header ul li:hover{
            color: #ED7E31;
            text-decoration: underline;
        }

        .logo{
            width: 150px;
            padding: -20px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 10px;
            }

            .header ul {
                gap: 10px;
                width: 100%;
            }

            .header ul li {
                font-size: 14px;
            }

            .logo {
                width: 120px;
            }

            #map {
                height: 80vh;
            }
        }
    </style>
</head>
<body>
    <div class="screen">
        <div class="header">
            <img class="logo" width="200px" src="https://www.almaty-marathon.kz/userdata/partners/partners_873/image.png" alt="">
            <ul>
                <li onclick="location.href='turkistan.html'">Басты бет</li>
                <li onclick="location.href='map.html'">Карта</li>
                <li>Байланыс</li>
                <li>Туризм</li>
            </ul>
        </div>


    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<div id="map" style="height: 100vh;"></div>

<script>
  var map = L.map('map').setView([43.297699, 68.271108], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  

  var AqMeshit = L.marker([43.29245911615071, 68.27382562823553]).addTo(map);
  AqMeshit.bindPopup("<b>Ақ Мешіт</b> <button style='float:right;' onclick=\"location.href='https://maps.app.goo.gl/EVkkfe3tTv65QPUB7'\";>360º</button> <br> <img width=\"200px\" class=\"main-img\" src=\"https://itinari-images.s3.eu-west-1.amazonaws.com/activity/images/original/2a28ed2c-ff3e-4abc-bea6-e8e82408c542-istock-1085609788.jpg\" alt=\"\">").openPopup();

  var KerewenSaray = L.marker([43.29470235690268, 68.27878937167043]).addTo(map);
  KerewenSaray.bindPopup("<b>Керевен Сарай</b> <button style='float:right;' onclick=\"location.href='https://maps.app.goo.gl/LdqdFP1J9yHGYFnB6'\";>360º</button> <br> <img width=\"200px\" class=\"main-img\" src=\"https://ticketon.kz/media/upload/25756u30705_297185522-min.jpg\" alt=\"\">").openPopup();

  var QojaAxmet = L.marker([43.297699, 68.271108]).addTo(map);
  QojaAxmet.bindPopup("<b>Қожа Ахмет Ясауи</b> <button style='float:right;' onclick=\"location.href='https://maps.app.goo.gl/EUxjECkE87o2Hte4A'\";>360º</button> <br> <img width=\"200px\" class=\"main-img\" src=\"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRPiX4jEnFKgDzoq6Fa7xjWORKyBK2eZqozg&s\" alt=\"\">").openPopup();

  var AlFarabi = L.marker([43.295031714099586, 68.27750934034154]).addTo(map);
  AlFarabi.bindPopup("<b>Аль-Фараби</b> <button style='float:right;' onclick=\"location.href='https://maps.app.goo.gl/gJtLPUiYxeWdma4L7'\";>360º</button> <br> <img width=\"200px\" class=\"main-img\" src=\"https://img.inform.kz/kazinform-photobank/media/2023-09-14/c66120e6-beda-4d50-aca7-cd8aa3ff3ef5.webp\" alt=\"\">").openPopup();

  function AqMeshit() {
    
  }
</script>

</body>
</html>
