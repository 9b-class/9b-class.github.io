        <script>

            const QojaAxmet = document.createElement("div");
            QojaAxmet.className = "turkistan";
            QojaAxmet.innerHTML = "<h3>Қожа Ахмет Ясауи кесенесі</h3> <img class=\"main-img\" src=\"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRPiX4jEnFKgDzoq6Fa7xjWORKyBK2eZqozg&s\" alt=\"\"> <p>Қожа Ахмет Ясауи кесенесі – Түркістан қаласындағы түркі әлемінің ең ірі тарихи және рухани ескерткіштерінің бірі. Бұл кесене XIV ғасырдың соңында Әмір Темірдің бұйрығымен ұлы сопы Қожа Ахмет Ясауидің қабірі үстіне салынған. Сәулет нысаны Орта Азиядағы ең ірі және әсерлі құрылымдардың бірі саналады. Кесене көне шығыс стилінде салынған, көлемі мен көркем безендірілуі ерекше. Онда 35-ке жуық бөлме мен зал бар, оның ішінде үлкен кіреберіс зал – «Қазандық», Қожа Ахмет Ясауидің қабірі орналасқан «Көрхана», сондай-ақ мешіт, кітапхана, мұрағат бөлмелері және тағы басқа орындар орналасқан. 1993 жылы Қожа Ахмет Ясауи кесенесі ЮНЕСКО-ның Бүкіләлемдік мұралар тізіміне енгізілді. Бұл ескерткіш – тек сәулет өнерінің жауһары ғана емес, сонымен қатар Қазақстан мен бүкіл түркі халықтарының рухани мұрасының айнасы.</p>"
            document.body.appendChild(QojaAxmet);

            const AqMeshit = document.createElement("div");
            AqMeshit.className = "turkistan";
            AqMeshit.innerHTML = "<h3>Ақ мешіт (Үлкен Ақ мешіт)</h3> <img class=\"main-img\" src=\"https://itinari-images.s3.eu-west-1.amazonaws.com/activity/images/original/2a28ed2c-ff3e-4abc-bea6-e8e82408c542-istock-1085609788.jpg\" alt=\"\"> <p>Ақ мешіт – Түркістан қаласындағы Қожа Ахмет Ясауи кесенесінің маңында орналасқан заманауи сәулеттік және діни нысан. Бұл мешіт 2021 жылы Түркістанның жаңару кезеңінде салынды және қазіргі заман мен ұлттық нақышты ұштастыра білген ерекше сәулетімен көз тартады. Мешіт бір мезгілде бірнеше мың адамды қабылдай алатын кең әрі жарық намазханалармен, дәретханалармен және діни ілім беру бөлмелерімен жабдықталған. Мешіттің ақ мәрмәрмен қапталған қабырғалары мен сәнді күмбездері оны Түркістанның жаңа рәміздерінің біріне айналдырды. Ақ мешіт – тек құлшылық орны ғана емес, сонымен қатар қаланың рухани өмірінің маңызды орталығы. Мұнда діни мерекелер, жұма намаздары және жастарға арналған тәрбиелік іс-шаралар жиі өткізіледі.</p>"
            document.body.appendChild(AqMeshit);

            const KerewenSaray = document.createElement("div");
            KerewenSaray.className = "turkistan";
            KerewenSaray.innerHTML = "<h3>Керуен Сарай</h3> <img class=\"main-img\" src=\"https://ticketon.kz/media/upload/25756u30705_297185522-min.jpg\" alt=\"\"> <p>Керуен Сарай – Түркістан қаласындағы заманауи туристік кешен. 2021 жылы ашылған бұл кешен Қожа Ахмет Ясауи кесенесінің жанында орналасқан және Жібек жолы дәуірінің сәулеті мен мәдениетін заманауи форматта қайта жаңғыртады. 20 гектар аумақта орналасқан кешенде шығыс базары, театрлар, қонақ үйлер, мейрамханалар, сауда орындары және су арнасы арқылы қайықпен серуендеу мүмкіндігі қарастырылған. Керуен Сарай – мәдениет пен туризмді біріктіретін, Түркістанның жаңа символына айналған кешен.</p>"
            document.body.appendChild(KerewenSaray);

            const AlFarabi = document.createElement("div");
            AlFarabi.className = "turkistan";
            AlFarabi.innerHTML = "<h3>Фараб кітапханасы</h3> <img class=\"main-img\" src=\"https://img.inform.kz/kazinform-photobank/media/2023-09-14/c66120e6-beda-4d50-aca7-cd8aa3ff3ef5.webp\" alt=\"\"> <p>Фараб кітапханасы — Түркістан қаласындағы заманауи үлгідегі зияткерлік орталық. Ол білім мен мәдениетті ұштастырып, оқырмандарға кітапхана қызметтерін жаңа форматта ұсынады. Мұнда 500 мыңнан астам кітап пен электронды ресурс, тыныш оқу залдары, балалар мен жастарға арналған аймақтар, сондай-ақ ғылыми және мәдени іс-шараларға арналған алаңдар бар. Кітапхана ұлы ойшыл Әл-Фарабидің құрметіне аталып, оның рухани-ғылыми мұрасын насихаттауға үлес қосып келеді.</p>"
            document.body.appendChild(AlFarabi);

            const NewCity = document.createElement("div");
            NewCity.className = "turkistan";
            NewCity.innerHTML = "<h3>Жаңа қала</h3> <img class=\"main-img\" src=\"newcity.jpg\" alt=\"\"> <p>Жаңа қала – Түркістан қаласындағы заманауи тұрғын үй кешені. Ол 2021 жылы ашылып, қала тұрғындары мен туристерге жаңа өмір сүру және демалу мүмкіндіктерін ұсынады. Жаңа қалада заманауи тұрғын үйлер, саябақтар, спорт алаңдары, сауда орталықтары мен мәдени нысандар орналасқан. Бұл кешен Түркістанның жаңа келбетін қалыптастырып, жастар мен отбасылар үшін қолайлы өмір сүру ортасын қамтамасыз етеді.</p>"
            document.body.appendChild(NewCity);
            
            const MuzSaray = document.createElement("div");
            MuzSaray.className = "turkistan";
            MuzSaray.innerHTML = "<h3>Мұз Сарайы</h3> <img class=\"main-img\" src=\"https://bassport.kz/storage/2023/06/23/E7F8YUWnuFbDmVRLyg5vNvtDoulcUY9dvdsP9R0L.jpg\" alt=\"\">  <p>Мұз Сарайы – Түркістан қаласындағы заманауи спорттық кешен. Ол 2021 жылы ашылып, қысқы спорт түрлерімен айналысуға арналған. Мұнда конькимен жүгіру, хоккей, мәнерлеп сырғанау және басқа да спорт түрлерімен айналысуға мүмкіндік бар. Кешеннің ішкі дизайны мен жабдықтары халықаралық стандарттарға сай келеді. Мұз Сарайы – Түркістанның спорттық өмірінің жаңа орталығы, мұнда түрлі жарыстар мен іс-шаралар өткізіледі.</p>"
            document.body.appendChild(MuzSaray);

            const CopyRight = document.createElement("h3");
            CopyRight.className = "turkistan";
            CopyRight.innerHTML = "<p>© 2025 Түркістан қаласы</p>"
            document.body.appendChild(CopyRight);
            
        </script>
